name: Scientific checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Initialize isolated logs before setup
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/p006-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$work/logs" "$work/tmp"
          printf 'P006_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$work/tmp" >> "$GITHUB_ENV"
          printf 'experiment_status=not_started\n' > "$work/logs/execution-status.txt"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          overwrite-settings: false

      - name: Prepare isolated fresh work area
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,shutil; shutil.copytree(os.environ["GITHUB_WORKSPACE"], os.path.join(os.environ["P006_WORK"],"artifact"), ignore=shutil.ignore_patterns(".git","__pycache__"))' \
            2>&1 | tee "$P006_WORK/logs/preparation.raw.log"

      - name: Run reviewed scientific stages without resume
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          cd "$P006_WORK/artifact"
          printf 'experiment_status=started\n' > "$P006_WORK/logs/execution-status.txt"
          # Bound the WHOLE sequence; leave job time for failure/timeout uploads.
          set +e
          timeout --signal=TERM --kill-after=30s 20m bash -euo pipefail <<'SCIENTIFIC' 2>&1 | tee "$P006_WORK/logs/scientific-run.raw.log"
          fresh="results/scientific-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_logged() {
            local name="$1"
            shift
            "$@" 2>&1 | tee "$P006_WORK/logs/$name.stdout.log"
          }
          run_logged python-version python --version
          run_logged java-version java -version
          run_logged javac-version javac -version
          run_logged tests python -B -m unittest discover -s tests -v
          run_logged inputs python -B verify_inputs.py
          run_logged bibliography python -B verify_bibliography.py \
            --bib docs/references.bib --audit docs/bibliography-audit.csv \
            --literature docs/literature.csv
          run_logged campaign python -B reproduce.py --output "$fresh/campaign"
          run_logged campaign-comparison python -B compare_results.py results/measured "$fresh/campaign"
          run_logged journal python -B journal_analysis.py --measured "$fresh/campaign" --output "$fresh/journal"
          run_logged journal-comparison python -B compare_journal.py results/journal "$fresh/journal" --current-source-surface
          SCIENTIFIC
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'experiment_exit_code=%s\nraw_log_exit_code=%s\n' \
            "${statuses[0]}" "${statuses[1]}" | tee "$P006_WORK/logs/execution-status.txt"
          if [ "${statuses[0]}" -ne 0 ]; then
            exit "${statuses[0]}"
          fi
          exit "${statuses[1]}"

      - name: Retain scientific outputs and stdout even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-scientific-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p006-${{ github.run_id }}-${{ github.run_attempt }}/logs/
            ${{ runner.temp }}/p006-${{ github.run_id }}-${{ github.run_attempt }}/artifact/results/scientific-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
